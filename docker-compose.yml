services:
  snowflake-emulator:
    build:
      context: .
      dockerfile: Dockerfile
    image: snowflake-emulator:latest
    container_name: snowflake-emulator
    ports:
      - "8080:8080"
    environment:
      - EMULATOR_HOST=0.0.0.0
      - EMULATOR_PORT=8080
      - EMULATOR_DB_PATH=/app/data/snowflake.duckdb
      - LOCAL_STAGE_DIR=/app/stage_storage
      - DEFAULT_DATABASE=DEMO_DB
      - DEFAULT_SCHEMA=PUBLIC
      - DEFAULT_WAREHOUSE=COMPUTE_WH
      - DEFAULT_ROLE=ACCOUNTADMIN
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./data:/app/data
      - ./stage_storage:/app/stage_storage
    depends_on:
      - minio
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio-s3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  minio-data:
